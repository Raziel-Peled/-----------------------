<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניתוח מנה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 340px;
            background-color: #f4f4f4;
            border: 2px solid #5a7dff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .camera-btn {
            background-color: #dbe4ff;
            border: 2px solid #5a7dff;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 22px;
            user-select: none;
        }
        .camera-btn:active {
            transform: scale(0.95);
        }
        .box {
            border: 1px solid #5a7dff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f4f4f4;
            text-align: center;
            min-height: 22px;
        }
        .dish-name {
            color: #d32f2f;
            font-weight: bold;
            font-size: 18px;
        }
        .stats-box {
            text-align: right;
            line-height: 2;
            font-size: 16px;
        }
        .loading {
            display: none;
            text-align: center;
            color: #5a7dff;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #fileInput {
            display: none;
        }
        /* אזור הגדרת מפתח API */
        .api-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            font-size: 12px;
            color: #555;
        }
        .api-row {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .api-row input {
            flex: 1;
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
            direction: ltr;
        }
        .api-row button {
            background-color: #5a7dff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="camera-btn" onclick="triggerCamera()">
        📷
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImage(event)">

    <div class="loading" id="loading">מנתח את המנה...</div>

    <div class="box dish-name" id="dishNameBox">
        שם המנה
    </div>

    <div class="box stats-box">
        <div>קלוריות : <span id="caloriesBox"></span></div>
        <div>פחמימות : <span id="carbsBox"></span></div>
        <div>חלבונים : <span id="proteinsBox"></span></div>
    </div>

    <div class="api-section">
        <label for="apiKeyInput">מפתח Gemini API (נשמר במכשיר בלבד):</label>
        <div class="api-row">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">שמור</button>
        </div>
    </div>
</div>

<script>
    // טעינת מפתח שמור בעליית הדף
    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (!key) {
            alert('אנא הזן מפתח API תקין');
            return;
        }
        localStorage.setItem('gemini_api_key', key);
        alert('המפתח נשמר בהצלחה בזיכרון הפלאפון!');
    }

    function triggerCamera() {
        const key = localStorage.getItem('gemini_api_key');
        if (!key) {
            alert('יש להזין ולשמור מפתח Gemini API בחלק התחתון לפני הצילום.');
            return;
        }
        document.getElementById('fileInput').click();
    }

    // כיווץ התמונה לפני השליחה כדי לחסוך זמן ונתונים בסלולר
    function compressImage(file, maxWidth = 1024) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // החזרת Base64 נקי ללא הקידומת
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Data = dataUrl.split(',')[1];
                    resolve(base64Data);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    async function handleImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const apiKey = localStorage.getItem('gemini_api_key');
        const loadingEl = document.getElementById('loading');
        
        loadingEl.style.display = 'block';
        document.getElementById('dishNameBox').innerText = '...';
        document.getElementById('caloriesBox').innerText = '...';
        document.getElementById('carbsBox').innerText = '...';
        document.getElementById('proteinsBox').innerText = '...';

        try {
            const base64Image = await compressImage(file);

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-4-hydrogen:generateContent?key=${apiKey}`;

            // הגדרת הבקשה וה-Structured Output בהתאם לשרטוט
            const payload = {
                contents: [{
                    parts: [
                        { text: "אתה תזונאי מומחה. נתח את מנת האוכל שבתמונה והחזר את הערכים התזונתיים המשוערים שלה בעברית." },
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Image
                            }
                        }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            dish_name: { type: "STRING", description: "שם המנה" },
                            calories: { type: "STRING", description: "כמות הקלוריות המשוערת, למשל '450 קלוריות'" },
                            proteins: { type: "STRING", description: "כמות החלבונים, למשל '30 גרם'" },
                            carbohydrates: { type: "STRING", description: "כמות הפחמימות, למשל '40 גרם'" }
                        },
                        required: ["dish_name", "calories", "proteins", "carbohydrates"]
                    }
                }
            };

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'שגיאה בתקשורת מול Gemini');
            }

            const result = await response.json();
            const rawText = result.candidates[0].content.parts[0].text;
            const nutritionData = JSON.parse(rawText);

            // עדכון הממשק
            document.getElementById('dishNameBox').innerText = nutritionData.dish_name || 'לא זוהה';
            document.getElementById('caloriesBox').innerText = nutritionData.calories || '-';
            document.getElementById('proteinsBox').innerText = nutritionData.proteins || '-';
            document.getElementById('carbsBox').innerText = nutritionData.carbohydrates || '-';

        } catch (error) {
            alert('שגיאה: ' + error.message);
            document.getElementById('dishNameBox').innerText = 'שגיאה בניתוח';
        } finally {
            loadingEl.style.display = 'none';
            event.target.value = ''; // איפוס הקלט לצילום הבא
        }
    }
</script>

</body>
</html>
